<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blob & Client File Downloader | JavaScript Curriculum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .card {
      max-width: 650px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
    }
    h1 { color: #38bdf8; font-size: 1.6rem; margin-bottom: 0.5rem; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    textarea {
      width: 100%;
      height: 140px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      padding: 0.85rem;
      font-family: monospace;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }
    .btn-row {
      display: flex;
      gap: 0.75rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-csv { background: #0284c7; color: white; }
    .btn-csv:hover { background: #0369a1; }
    .btn-json { background: #059669; color: white; }
    .btn-json:hover { background: #047857; }
    a.back { color: #94a3b8; text-decoration: none; font-size: 0.85rem; display: inline-block; margin-top: 1.5rem; }
    a.back:hover { color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💾 Client-Side Blob File Generator</h1>
    <p class="sub">Generate and download files directly in the browser with zero backend server dependencies!</p>

    <label style="display:block; font-size:0.85rem; color:#94a3b8; margin-bottom:0.4rem;">Edit text or data to export:</label>
    <textarea id="fileContent">id,name,role,department
101,Shivang,Full-Stack Lead,Engineering
102,Riya,UI/UX Designer,Design
103,Aman,Backend Dev,Engineering
104,Pooja,QA Engineer,Quality</textarea>

    <div class="btn-row">
      <button class="btn-csv" id="downloadCsvBtn">Export as CSV File (.csv)</button>
      <button class="btn-json" id="downloadTxtBtn">Export as Text File (.txt)</button>
    </div>

    <a href="../11-browser-features-and-storage/storage-interactive-tester.html" class="back">← Return to Storage Tester</a>
  </div>

  <script>
    function triggerBlobDownload(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const objectUrl = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = objectUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();

      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }

    document.getElementById("downloadCsvBtn").addEventListener("click", () => {
      const content = document.getElementById("fileContent").value;
      triggerBlobDownload(content, "team_report.csv", "text/csv;charset=utf-8;");
    });

    document.getElementById("downloadTxtBtn").addEventListener("click", () => {
      const content = document.getElementById("fileContent").value;
      triggerBlobDownload(content, "notes.txt", "text/plain;charset=utf-8;");
    });
  </script>
</body>
</html>
