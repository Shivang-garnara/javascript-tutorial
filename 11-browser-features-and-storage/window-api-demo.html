<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Window & Web APIs Playground</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      max-width: 650px;
      width: 100%;
      background: #1e293b;
      padding: 24px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; font-size: 22px; margin-top: 0; }
    .section {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    button {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { background: #7dd3fc; }
    .output {
      margin-top: 8px;
      padding: 8px;
      background: #1e293b;
      border-radius: 4px;
      font-family: monospace;
      color: #facc15;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌐 Window & Web APIs Playground</h1>

    <!-- 1. Popups: Confirm & Prompt -->
    <div class="section">
      <h3>1. Window Popups</h3>
      <button onclick="testConfirm()">Run window.confirm()</button>
      <button onclick="testPrompt()">Run window.prompt()</button>
      <div id="popupResult" class="output">Click a button to test</div>
    </div>

    <!-- 2. Screen & Viewport Inspector -->
    <div class="section">
      <h3>2. Screen & Window Inspector</h3>
      <button onclick="inspectScreen()">Inspect Dimensions</button>
      <div id="screenResult" class="output">Click to check your screen & window size</div>
    </div>

    <!-- 3. Navigator & Online Status -->
    <div class="section">
      <h3>3. Navigator & Connection Status</h3>
      <button onclick="inspectNavigator()">Inspect Browser & Network</button>
      <div id="navResult" class="output">Click to inspect</div>
    </div>
  </div>

  <script>
    function testConfirm() {
      const result = window.confirm("Do you agree to continue learning JavaScript?");
      document.getElementById("popupResult").textContent = 
        result ? "User clicked OK! (true)" : "User clicked Cancel! (false)";
    }

    function testPrompt() {
      const name = window.prompt("What is your name?", "Shivang");
      document.getElementById("popupResult").textContent = 
        name !== null ? `Hello, ${name}!` : "Prompt cancelled (null).";
    }

    function inspectScreen() {
      document.getElementById("screenResult").innerHTML = `
        Screen Resolution: ${window.screen.width} x ${window.screen.height}<br>
        Available Screen: ${window.screen.availWidth} x ${window.screen.availHeight}<br>
        Browser Viewport: ${window.innerWidth} x ${window.innerHeight}<br>
        Color Depth: ${window.screen.colorDepth}-bit
      `;
    }

    function inspectNavigator() {
      document.getElementById("navResult").innerHTML = `
        Browser Online: ${navigator.onLine ? "🟢 Connected" : "🔴 Offline"}<br>
        Language: ${navigator.language}<br>
        Cookies Enabled: ${navigator.cookieEnabled}<br>
        Platform/OS: ${navigator.platform}
      `;
    }
  </script>
</body>
</html>
