<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W3Schools Example: Modal Popup Box</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #0b1120;
      color: #fff;
    }
    .open-btn {
      background-color: #38bdf8;
      color: #0f172a;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .open-btn:hover { background-color: #7dd3fc; }

    /* The Modal (background overlay) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    /* Modal Content Box */
    .modal-content {
      background-color: #1e293b;
      margin: 12% auto;
      padding: 24px;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      text-align: left;
      animation: animatetop 0.4s;
    }

    @keyframes animatetop {
      from { top: -100px; opacity: 0; }
      to { top: 0; opacity: 1; }
    }

    .close-btn {
      color: #94a3b8;
      float: right;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: #f87171; }
  </style>
</head>
<body>

  <h2>W3Schools: JavaScript Modal Box</h2>
  <p style="color:#94a3b8;">Click the button below to display the modal overlay:</p>

  <button id="myBtn" class="open-btn">Open Interactive Modal</button>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h3 style="margin-top:0; color:#38bdf8;">🎉 Modal Dialog</h3>
      <p style="color:#cbd5e1; line-height:1.6;">
        This modal dialog is controlled by JavaScript:
        <br>• Clicking the button sets <code>modal.style.display = "block"</code>.
        <br>• Clicking the <strong>&times;</strong> button or clicking <strong>anywhere outside the box</strong> closes the modal!
      </p>
      <button onclick="closeModal()" style="padding:8px 16px; background:#10b981; border:none; border-radius:6px; font-weight:bold; cursor:pointer; color:#fff;">Got it!</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById("myModal");
    const btn = document.getElementById("myBtn");
    const span = document.getElementsByClassName("close-btn")[0];

    btn.onclick = function() {
      modal.style.display = "block";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    span.onclick = closeModal;

    // When the user clicks anywhere outside of the modal, close it
    window.onclick = function(event) {
      if (event.target == modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
