<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>W3Schools Example: Digital Clock</title>
  <style>
    body { font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; background: #0b1120; color: #38bdf8; }
    h1 { font-size: 54px; margin: 0; padding: 20px 40px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    p { font-family: sans-serif; color: #94a3b8; margin-top: 15px; }
  </style>
</head>
<body onload="startTime()">
  <h1 id="clock">00:00:00</h1>
  <p>Live timing using JavaScript <code>setInterval()</code></p>

  <script>
    function startTime() {
      const today = new Date();
      let h = today.getHours();
      let m = today.getMinutes();
      let s = today.getSeconds();
      m = checkTime(m);
      s = checkTime(s);
      document.getElementById('clock').innerHTML = h + ":" + m + ":" + s;
      setTimeout(startTime, 1000);
    }
    function checkTime(i) {
      if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
      return i;
    }
  </script>
</body>
</html>
