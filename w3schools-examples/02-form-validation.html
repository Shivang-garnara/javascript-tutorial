<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>W3Schools Example: Form Validation</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; background: #0f172a; color: #fff; padding: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; }
    button { padding: 10px 18px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .msg { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>W3Schools: JavaScript Form Validation</h2>
  <p>Please enter a number between 1 and 10:</p>

  <input id="numb" type="text" placeholder="Enter number..." />
  <button type="button" onclick="myValidation()">Submit</button>

  <p id="demo" class="msg"></p>

  <script>
    function myValidation() {
      const x = document.getElementById("numb").value;
      let text;
      if (isNaN(x) || x < 1 || x > 10 || x.trim() === "") {
        text = "❌ Input not valid (Must be a number from 1 to 10)";
        document.getElementById("demo").style.color = "#ef4444";
      } else {
        text = "✅ Input OK";
        document.getElementById("demo").style.color = "#10b981";
      }
      document.getElementById("demo").innerHTML = text;
    }
  </script>
</body>
</html>
