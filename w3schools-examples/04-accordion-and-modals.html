<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>W3Schools Example: Accordion & Modal Popup</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; background: #0f172a; color: #fff; padding: 20px; }
    .accordion { background-color: #1e293b; color: #fff; cursor: pointer; padding: 15px; width: 100%; text-align: left; border: none; outline: none; transition: 0.3s; font-size: 16px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    .active, .accordion:hover { background-color: #334155; }
    .panel { padding: 0 18px; display: none; background-color: #0f172a; border-left: 3px solid #38bdf8; overflow: hidden; margin-top: 4px; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <h2>W3Schools: JavaScript Accordions</h2>
  <button class="accordion">Section 1: What is the DOM?</button>
  <div class="panel"><p>The Document Object Model (DOM) is an application programming interface for HTML and XML documents.</p></div>

  <button class="accordion">Section 2: What are Events?</button>
  <div class="panel"><p>HTML events are "things" that happen to HTML elements, such as mouse clicks, page loads, or key presses.</p></div>

  <script>
    const acc = document.getElementsByClassName("accordion");
    for (let i = 0; i < acc.length; i++) {
      acc[i].addEventListener("click", function() {
        this.classList.toggle("active");
        const panel = this.nextElementSibling;
        panel.style.display = panel.style.display === "block" ? "none" : "block";
      });
    }
  </script>
</body>
</html>
