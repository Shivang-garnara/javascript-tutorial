<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W3Schools JavaScript 2D Graphics & Canvas</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      max-width: 680px;
      width: 100%;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; font-size: 24px; margin-top: 0; }
    canvas {
      background: #020617;
      border: 2px solid #475569;
      border-radius: 8px;
      display: block;
      margin: 15px auto;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    button {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #7dd3fc; }
    button.alt-btn { background: #a855f7; color: #fff; }
    button.alt-btn:hover { background: #9333ea; }
    button.clear-btn { background: #ef4444; color: #fff; }
    button.clear-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎨 W3Schools HTML5 Canvas Graphics Playground</h1>
    <p>JavaScript drawing 2D shapes, gradients, and running 60 FPS animations on the HTML5 Canvas:</p>

    <canvas id="myCanvas" width="600" height="300"></canvas>

    <div class="btn-row">
      <button onclick="drawShapes()">Draw Shapes & Text</button>
      <button onclick="drawGradient()" class="alt-btn">Draw Gradient</button>
      <button onclick="toggleAnimation()" style="background:#10b981; color:#fff;" id="animBtn">Start Bouncing Ball ⚽</button>
      <button onclick="clearCanvas()" class="clear-btn">Clear Canvas</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    let isAnimating = false;
    let ballX = 50, ballY = 50;
    let speedX = 4, speedY = 3;
    const ballRadius = 15;
    let animId = null;

    function clearCanvas() {
      if (isAnimating) toggleAnimation();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawShapes() {
      clearCanvas();
      
      // 1. Rectangle
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(40, 40, 140, 80);

      // 2. Stroke Circle
      ctx.beginPath();
      ctx.arc(300, 80, 45, 0, 2 * Math.PI);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 5;
      ctx.stroke();

      // 3. Filled Circle
      ctx.beginPath();
      ctx.arc(480, 80, 45, 0, 2 * Math.PI);
      ctx.fillStyle = "#10b981";
      ctx.fill();

      // 4. Text
      ctx.font = "bold 22px Segoe UI";
      ctx.fillStyle = "#ffffff";
      ctx.fillText("Rendered with JavaScript Canvas API!", 90, 220);
    }

    function drawGradient() {
      clearCanvas();
      const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
      grad.addColorStop(0, "#ec4899");
      grad.addColorStop(0.5, "#8b5cf6");
      grad.addColorStop(1, "#3b82f6");

      ctx.fillStyle = grad;
      ctx.fillRect(40, 50, 520, 180);

      ctx.font = "bold 28px Segoe UI";
      ctx.fillStyle = "#ffffff";
      ctx.fillText("Linear Gradient in 2D Context", 110, 150);
    }

    function animateBall() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Ball
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballRadius, 0, 2 * Math.PI);
      ctx.fillStyle = "#facc15";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wall Collision Physics
      if (ballX + speedX > canvas.width - ballRadius || ballX + speedX < ballRadius) {
        speedX = -speedX;
      }
      if (ballY + speedY > canvas.height - ballRadius || ballY + speedY < ballRadius) {
        speedY = -speedY;
      }

      ballX += speedX;
      ballY += speedY;

      animId = requestAnimationFrame(animateBall);
    }

    function toggleAnimation() {
      const btn = document.getElementById("animBtn");
      if (!isAnimating) {
        isAnimating = true;
        btn.textContent = "Stop Animation ⏸️";
        btn.style.background = "#eab308";
        animateBall();
      } else {
        isAnimating = false;
        cancelAnimationFrame(animId);
        btn.textContent = "Start Bouncing Ball ⚽";
        btn.style.background = "#10b981";
      }
    }

    // Initial drawing
    drawShapes();
  </script>
</body>
</html>
