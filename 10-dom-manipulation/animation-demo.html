<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>requestAnimationFrame 60 FPS Demo | JavaScript Curriculum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .card {
      max-width: 700px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
    }
    h1 { color: #38bdf8; font-size: 1.6rem; margin-bottom: 0.5rem; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .track {
      width: 100%;
      height: 90px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      position: absolute;
      top: 15px;
      left: 0;
    }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-start { background: #0284c7; color: white; }
    .btn-stop { background: #dc2626; color: white; }
    .fps-meter {
      font-family: monospace;
      font-size: 0.9rem;
      color: #10b981;
    }
    a.back { color: #94a3b8; text-decoration: none; font-size: 0.85rem; display: inline-block; margin-top: 1.5rem; }
    a.back:hover { color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 60 FPS requestAnimationFrame Lab</h1>
    <p class="sub">Notice how silky-smooth the movement is because each frame syncs with your monitor's GPU refresh!</p>

    <div class="track" id="track">
      <div class="orb" id="orb"></div>
    </div>

    <div class="btn-row">
      <button class="btn-start" id="startBtn">Start Animation Loop</button>
      <button class="btn-stop" id="stopBtn">Pause (cancelAnimationFrame)</button>
    </div>

    <div class="fps-meter" id="fpsDisplay">Status: Idle</div>

    <a href="../10-dom-manipulation/index.html" class="back">← Return to DOM Manipulation Hub</a>
  </div>

  <script>
    const orb = document.getElementById("orb");
    const track = document.getElementById("track");
    const fpsDisplay = document.getElementById("fpsDisplay");

    let animId = null;
    let posX = 0;
    let direction = 1;
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    function loop(currentTime) {
      // Calculate delta time
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      // Update position (300 pixels per second)
      const maxDistance = track.clientWidth - 70;
      posX += 300 * dt * direction;

      if (posX >= maxDistance) {
        posX = maxDistance;
        direction = -1;
      } else if (posX <= 0) {
        posX = 0;
        direction = 1;
      }

      orb.style.transform = `translateX(${posX}px)`;

      // FPS Counter
      frameCount++;
      if (currentTime - lastFpsUpdate >= 500) {
        const fps = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
        fpsDisplay.textContent = `FPS: ${fps} | Delta: ${(dt * 1000).toFixed(1)}ms | Position: ${Math.round(posX)}px`;
        frameCount = 0;
        lastFpsUpdate = currentTime;
      }

      animId = requestAnimationFrame(loop);
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      if (!animId) {
        lastTime = performance.now();
        animId = requestAnimationFrame(loop);
      }
    });

    document.getElementById("stopBtn").addEventListener("click", () => {
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
        fpsDisplay.textContent = "Status: Paused";
      }
    });
  </script>
</body>
</html>
