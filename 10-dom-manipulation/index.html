<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level 10 — DOM Manipulation Playground</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h1 { color: #38bdf8; font-size: 24px; margin-top: 0; }
    .section {
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    input[type="text"] {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
      width: calc(100% - 130px);
    }
    button {
      padding: 10px 18px;
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #7dd3fc; }
    ul { list-style: none; padding: 0; margin-top: 15px; }
    li {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    li.completed {
      text-decoration: line-through;
      color: #64748b;
    }
    .del-btn {
      background: #ef4444;
      color: #fff;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }
    .del-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ Level 10: Live DOM Playground</h1>
    
    <!-- 1. Interactive Counter -->
    <div class="section">
      <h3>1. Live Click Counter</h3>
      <p>Clicks: <span id="counterValue" style="font-weight:bold; color:#facc15;">0</span></p>
      <button id="counterBtn">Click Me!</button>
      <button id="resetBtn" style="background:#64748b; color:#fff;">Reset</button>
    </div>

    <!-- 2. Interactive To-Do List with Event Delegation -->
    <div class="section">
      <h3>2. Dynamic Task List (DOM Creation & Removal)</h3>
      <div style="display:flex;">
        <input type="text" id="taskInput" placeholder="Enter a new task..." />
        <button id="addTaskBtn">Add Task</button>
      </div>
      <ul id="taskList">
        <li><span>Master JavaScript Basics</span> <button class="del-btn">Delete</button></li>
      </ul>
      <p style="font-size:12px; color:#94a3b8;">Tip: Click task text to strike through, click red button to delete.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
